version: "2"

linters:
  enable:
    - gocritic
    - misspell
    - nolintlint
    - revive
    - unconvert
  disable:
    - errcheck
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    gocritic:
      enabled-tags:
        - diagnostic
        - style
      disabled-checks:
        - unnamedResult
        - exitAfterDefer
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
          disabled: true
        - name: var-naming
          disabled: true
  exclusions:
    rules:
      # staticcheck's SA5011 doesn't model (*testing.T).Fatal /
      # Fatalf / FailNow as terminating (they call runtime.Goexit
      # internally). In tests the `if x == nil { t.Fatal(...) }; x.Foo`
      # pattern is idiomatic, so silence the check only for _test.go.
      - path: _test\.go
        linters:
          - staticcheck
        text: SA5011

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
